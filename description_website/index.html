<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descriptions du Tour de France</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="tour-de-france-logo.png">
</head>
<body>
    <h1>Descriptions détaillées du Tour de France</h1>

    <!-- STEP 1: Top Menu (Years) -->
    <div class="year-menu">
        <button class="year-button active" onclick="switchYear(event, '1947')">1947</button>
    </div>

    <!-- STEP 2: Second Menu (File Tabs) -->
    <div class="tab-menu">
        <!-- Note: We just pass the exact file name here -->
        <button class="tab-button active" onclick="switchTab(event, 'stage_1.html')">Étape 1</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_2.html')">Étape 2</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_3.html')">Étape 3</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_4.html')">Étape 4</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_5.html')">Étape 5</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_6.html')">Étape 6</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_7.html')">Étape 7</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_8.html')">Étape 8</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_9.html')">Étape 9</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_10.html')">Étape 10</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_11.html')">Étape 11</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_12.html')">Étape 12</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_13.html')">Étape 13</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_14.html')">Étape 14</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_15.html')">Étape 15</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_16.html')">Étape 16</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_17.html')">Étape 17</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_18.html')">Étape 18</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_19.html')">Étape 19</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_20.html')">Étape 20</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_21.html')">Étape 21</button>
    </div>

    <!-- STEP 3: Side-by-side stage content -->
    <main id="content-area" class="content-panel" aria-live="polite">
        <em>Loading...</em>
    </main>

    <script>
        let currentYear = '1947';
        let currentFile = 'stage_1.html';
        let currentDescriptionType = 'detailed';
        let contentRequest = 0;
        let arkCachePromise;

        const articleDatesByYear = {
            '1947': {
                1: '26-06-1947',
                2: '27-06-1947',
                3: '28-06-1947',
                4: '29-06-1947',
                5: '30-06-1947',
                6: '02-07-1947',
                7: '03-07-1947',
                8: '04-07-1947',
                9: '06-07-1947',
                10: '07-07-1947',
                11: '09-07-1947',
                12: '10-07-1947',
                13: '11-07-1947',
                14: '12-07-1947',
                15: '14-07-1947',
                16: '15-07-1947',
                17: '16-07-1947',
                18: '17-07-1947',
                19: '19-07-1947',
                20: '20-07-1947',
                21: '21-07-1947'
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchContent();
        });

        function switchYear(event, year) {
            currentYear = year;
            document.querySelectorAll('.year-button').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            fetchContent();
        }

        function switchTab(event, filename) {
            currentFile = filename;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            fetchContent();
        }

        function switchDescription(type) {
            currentDescriptionType = type;
            const isDetailed = type === 'detailed';
            document.getElementById('description-heading').textContent =
                isDetailed ? 'Description détaillée' : 'Description sourcée';
            document.getElementById('detailed-description-content').hidden = !isDetailed;
            document.getElementById('sourced-description-content').hidden = isDetailed;
            document.querySelectorAll('.description-toggle-button').forEach(button => {
                const isActive = button.dataset.descriptionType === type;
                button.classList.toggle('active', isActive);
                button.setAttribute('aria-pressed', String(isActive));
            });
        }

        async function fetchFromPaths(paths) {
            let lastError;
            for (const path of paths) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) {
                        throw new Error(`Unable to load ${path} (HTTP ${response.status})`);
                    }
                    return await response.text();
                } catch (error) {
                    lastError = error;
                }
            }
            throw lastError;
        }

        function contentPaths(directory, filename) {
            return [
                `../gallica_analysis/${directory}/${currentYear}/${filename}`,
                `./gallica_analysis/${directory}/${currentYear}/${filename}`
            ];
        }

        function arkCachePaths() {
            return [
                '../gallica_analysis/cache/equipe_ark_ids.json',
                './gallica_analysis/cache/equipe_ark_ids.json'
            ];
        }

        function loadArkCache() {
            if (!arkCachePromise) {
                arkCachePromise = fetchFromPaths(arkCachePaths())
                    .then(JSON.parse)
                    .catch(error => {
                        arkCachePromise = undefined;
                        throw error;
                    });
            }
            return arkCachePromise;
        }

        function formatArticleDate(filename) {
            const dateParts = filename.match(/^(\d{2})-(\d{2})-(\d{4})_/);
            if (!dateParts) return '';

            const [, day, month, year] = dateParts;
            const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
            return new Intl.DateTimeFormat('fr-FR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                timeZone: 'UTC'
            }).format(date);
        }

        async function fetchContent() {
            const requestId = ++contentRequest;
            const container = document.getElementById('content-area');
            const stageNumber = Number(currentFile.match(/^stage_(\d+)\.html$/)?.[1]);
            const articleFilename = `stage_${stageNumber}.txt`;
            const articleDate = articleDatesByYear[currentYear]?.[stageNumber];
            container.innerHTML = '<em>Loading stage content...</em>';

            if (!stageNumber) {
                container.innerHTML = `<p class="load-error">No cleaned Gemini article is configured for ${currentYear}, stage ${stageNumber || 'unknown'}.</p>`;
                return;
            }

            const [descriptionResult, sourcedDescriptionResult, articleResult, arkCacheResult] = await Promise.allSettled([
                fetchFromPaths(contentPaths('detailed_descriptions_gemini', currentFile)),
                fetchFromPaths(contentPaths('sourced_descriptions_gemini', currentFile)),
                fetchFromPaths(contentPaths('clean_articles_gemini', articleFilename)),
                loadArkCache()
            ]);

            if (requestId !== contentRequest) return;

            container.innerHTML = `
                <section class="content-column">
                    <div class="description-heading">
                        <h2 id="description-heading">Description détaillée</h2>
                        <div class="description-toggle" role="group" aria-label="Type de description">
                            <button type="button" class="description-toggle-button active"
                                data-description-type="detailed" aria-pressed="true"
                                aria-controls="detailed-description-content"
                                onclick="switchDescription('detailed')">Détaillée</button>
                            <button type="button" class="description-toggle-button"
                                data-description-type="sourced" aria-pressed="false"
                                aria-controls="sourced-description-content"
                                onclick="switchDescription('sourced')">Sourcée</button>
                        </div>
                    </div>
                    <div class="column-content" id="detailed-description-content"></div>
                    <div class="column-content" id="sourced-description-content" hidden></div>
                </section>
                <section class="content-column">
                    <h2>
                        Article de L'Équipe du ${formatArticleDate(articleFilename)}
                        <a class="gallica-link" id="gallica-article-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Voir sur Gallica</a>
                    </h2>
                    <div class="column-content article-content" id="article-content"></div>
                </section>`;
            switchDescription(currentDescriptionType);

            const gallicaLink = document.getElementById('gallica-article-link');
            if (arkCacheResult.status === 'fulfilled') {
                const arkId = articleDate ? arkCacheResult.value[articleDate] : null;
                if (typeof arkId === 'string' && /^[a-zA-Z0-9]+$/.test(arkId)) {
                    gallicaLink.href = `https://gallica.bnf.fr/ark:/12148/${arkId}`;
                    gallicaLink.hidden = false;
                } else {
                    console.error(`No Gallica ARK ID found for article dated ${articleDate || 'unknown'}.`);
                }
            } else {
                console.error(arkCacheResult.reason);
            }

            const articleContent = document.getElementById('article-content');
            if (articleResult.status === 'fulfilled') {
                renderArticleSections(articleContent, articleResult.value);
            } else {
                articleContent.textContent = 'The cleaned Gemini article could not be loaded.';
                articleContent.classList.add('load-error');
                console.error(articleResult.reason);
            }

            if (descriptionResult.status === 'fulfilled') {
                const descriptionContent = document.getElementById('detailed-description-content');
                descriptionContent.innerHTML = descriptionResult.value;
                linkDescriptionCitations(descriptionContent, articleContent);
            } else {
                document.getElementById('detailed-description-content').innerHTML =
                    '<p class="load-error">The detailed description could not be loaded.</p>';
                console.error(descriptionResult.reason);
            }

            if (sourcedDescriptionResult.status === 'fulfilled') {
                document.getElementById('sourced-description-content').innerHTML = sourcedDescriptionResult.value;
            } else {
                document.getElementById('sourced-description-content').innerHTML =
                    '<p class="load-error">La description sourcée n’est pas disponible pour cette étape.</p>';
                console.error(sourcedDescriptionResult.reason);
            }
        }

        function renderArticleSections(articleContent, articleText) {
            const sectionPattern = /^[ \t\r]*Section[ \t]+(\d+)[ \t\r]*:[ \t\r]*$/gim;
            const matches = [...articleText.matchAll(sectionPattern)];
            const sectionsByNumber = new Map();

            if (matches.length === 0) {
                const articleTextBlock = document.createElement('pre');
                articleTextBlock.textContent = articleText;
                articleContent.append(articleTextBlock);
                return sectionsByNumber;
            }

            matches.forEach((match, index) => {
                const sectionNumber = match[1];
                const contentStart = match.index + match[0].length;
                const contentEnd = matches[index + 1]?.index ?? articleText.length;
                const sectionText = articleText
                    .slice(contentStart, contentEnd)
                    .replace(/^\r?\n/, '')
                    .trimEnd();
                const section = document.createElement('section');
                const heading = document.createElement('h3');
                const textBlock = document.createElement('pre');

                section.id = `article-section-${sectionNumber}`;
                section.className = 'article-section';
                section.tabIndex = -1;
                heading.textContent = `Section ${sectionNumber}`;
                textBlock.textContent = sectionText;
                section.append(heading, textBlock);
                articleContent.append(section);

                if (!sectionsByNumber.has(sectionNumber)) {
                    sectionsByNumber.set(sectionNumber, section);
                }
            });

            return sectionsByNumber;
        }

        function linkDescriptionCitations(descriptionContent, articleContent) {
            const sectionsByNumber = new Map(
                [...articleContent.querySelectorAll('.article-section')].map(section => [
                    section.id.slice('article-section-'.length),
                    section
                ])
            );
            const citationPattern = /\[(\s*\d+(?:\s*,\s*\d+)*\s*)\]/g;
            const textNodes = [];
            const walker = document.createTreeWalker(descriptionContent, NodeFilter.SHOW_TEXT);

            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }

            for (const textNode of textNodes) {
                if (!textNode.textContent) continue;
                citationPattern.lastIndex = 0;
                if (!citationPattern.test(textNode.textContent)) continue;
                citationPattern.lastIndex = 0;

                const fragment = document.createDocumentFragment();
                let cursor = 0;
                let citationMatch;

                while ((citationMatch = citationPattern.exec(textNode.textContent))) {
                    fragment.append(textNode.textContent.slice(cursor, citationMatch.index), '[');
                    const citationParts = citationMatch[1].match(/\d+|[,\s]+/g) ?? [];
                    for (const part of citationParts) {
                        if (/^\d+$/.test(part) && sectionsByNumber.has(part)) {
                            const link = document.createElement('a');
                            link.className = 'article-citation';
                            link.href = `#article-section-${part}`;
                            link.textContent = part;
                            fragment.append(link);
                        } else {
                            fragment.append(part);
                        }
                    }
                    fragment.append(']');
                    cursor = citationPattern.lastIndex;
                }

                fragment.append(textNode.textContent.slice(cursor));
                textNode.replaceWith(fragment);
            }

            descriptionContent.addEventListener('click', event => {
                const link = event.target instanceof Element
                    ? event.target.closest('a.article-citation')
                    : null;
                if (!link) return;

                const section = sectionsByNumber.get(link.textContent);
                if (!section) return;

                event.preventDefault();
                articleContent.scrollTo({
                    top: articleContent.scrollTop
                        + section.getBoundingClientRect().top
                        - articleContent.getBoundingClientRect().top,
                    behavior: 'smooth'
                });
                section.focus({ preventScroll: true });
            });
        }
    </script>
</body>
</html>
