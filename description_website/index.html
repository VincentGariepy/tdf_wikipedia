<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descriptions du Tour de France</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="tour-de-france-logo.png">
</head>
<body>
    <!-- Top Header & Branding -->
    <header class="app-header">
        <div class="header-brand">
            <img src="tour-de-france-logo.png" alt="Logo Tour de France" class="brand-logo" width="44" height="44">
            <div class="brand-info">
                <h1 class="brand-title">Descriptions détaillées du Tour de France</h1>
                <p class="brand-subtitle">Archives de presse (Gallica / BnF)</p>
            </div>
        </div>
    </header>

    <!-- STEP 1: Year Menu -->
    <nav class="year-menu" aria-label="Sélection de l'année">
        <span class="menu-label">Année</span>
        <div class="year-buttons">
            <button type="button" class="year-button active" onclick="switchYear(event, '1947')">1947</button>
        </div>
    </nav>

    <!-- STEP 2: Stage Tabs -->
    <div class="tab-menu-wrapper">
        <nav class="tab-menu" id="stage-tabs" aria-label="Sélection de l'étape">
            <button type="button" class="tab-button active" onclick="switchTab(event, 'stage_1.html')">Étape 1</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_2.html')">Étape 2</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_3.html')">Étape 3</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_4.html')">Étape 4</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_5.html')">Étape 5</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_6.html')">Étape 6</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_7.html')">Étape 7</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_8.html')">Étape 8</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_9.html')">Étape 9</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_10.html')">Étape 10</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_11.html')">Étape 11</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_12.html')">Étape 12</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_13.html')">Étape 13</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_14.html')">Étape 14</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_15.html')">Étape 15</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_16.html')">Étape 16</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_17.html')">Étape 17</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_18.html')">Étape 18</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_19.html')">Étape 19</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_20.html')">Étape 20</button>
            <button type="button" class="tab-button" onclick="switchTab(event, 'stage_21.html')">Étape 21</button>
        </nav>
    </div>

    <!-- STEP 3: Side-by-side stage content -->
    <main id="content-area" class="content-panel" aria-live="polite">
        <div class="loading-container">
            <div class="spinner"></div>
            <span>Chargement du contenu de l'étape...</span>
        </div>
    </main>

    <!-- Toast container for copy confirmations -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script>
        let currentYear = '1947';
        let currentFile = 'stage_1.html';
        let currentNewspaper = 'equipe';
        let currentDescriptionType = 'detailed';
        let currentSourcedRawText = '';
        let currentStageArticles = {};
        let contentRequest = 0;
        const arkCachePromises = {};

        const NEWSPAPERS = [
            { id: 'equipe', label: "L'Équipe", sectionPrefix: '1' },
            { id: 'figaro', label: 'Le Figaro', sectionPrefix: '2' },
            { id: 'franc_tireur', label: 'Franc-Tireur', sectionPrefix: '3' },
            { id: 'humanite', label: "L'Humanité", sectionPrefix: '4' },
            { id: 'liberation', label: 'Libération', sectionPrefix: '5' }
        ];

        const newspaperNames = Object.fromEntries(NEWSPAPERS.map(n => [n.id, n.label]));

        const articleDatesByYear = {
            '1947': {
                1: '26-06-1947',
                2: '27-06-1947',
                3: '28-06-1947',
                4: '29-06-1947',
                5: '30-06-1947',
                6: '02-07-1947',
                7: '03-07-1947',
                8: '04-07-1947',
                9: '06-07-1947',
                10: '07-07-1947',
                11: '09-07-1947',
                12: '10-07-1947',
                13: '11-07-1947',
                14: '12-07-1947',
                15: '14-07-1947',
                16: '15-07-1947',
                17: '16-07-1947',
                18: '17-07-1947',
                19: '19-07-1947',
                20: '20-07-1947',
                21: '21-07-1947'
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchContent();
        });

        function switchYear(event, year) {
            currentYear = year;
            document.querySelectorAll('.year-button').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            fetchContent();
        }

        function switchTab(event, filename) {
            currentFile = filename;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            const clickedBtn = event.currentTarget;
            clickedBtn.classList.add('active');
            clickedBtn.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
            fetchContent();
        }

        function switchDescription(type) {
            currentDescriptionType = type;
            const isDetailed = type === 'detailed';
            const heading = document.getElementById('description-heading');
            if (heading) {
                heading.textContent = isDetailed ? 'Description détaillée' : 'Description sourcée';
            }

            const detailedContent = document.getElementById('detailed-description-content');
            if (detailedContent) {
                detailedContent.hidden = !isDetailed;
                detailedContent.style.display = isDetailed ? '' : 'none';
            }

            const sourcedContent = document.getElementById('sourced-description-content');
            if (sourcedContent) {
                sourcedContent.hidden = isDetailed;
                sourcedContent.style.display = isDetailed ? 'none' : 'flex';
            }

            document.querySelectorAll('.description-toggle-button').forEach(button => {
                const isActive = button.dataset.descriptionType === type;
                button.classList.toggle('active', isActive);
                button.setAttribute('aria-pressed', String(isActive));
            });
        }

        async function copySourcedDescription() {
            let textToCopy = currentSourcedRawText;
            if (!textToCopy) {
                const textEl = document.getElementById('sourced-description-text');
                textToCopy = textEl ? textEl.textContent : '';
            }

            if (!textToCopy) {
                showToast('Aucun texte à copier.', 'error');
                return;
            }

            let copied = false;
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    copied = true;
                } catch (err) {
                    console.warn('Clipboard API error, fallback to execCommand', err);
                }
            }

            if (!copied) {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = textToCopy;
                    textarea.setAttribute('readonly', '');
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    textarea.style.pointerEvents = 'none';
                    document.body.appendChild(textarea);
                    textarea.select();
                    copied = document.execCommand('copy');
                    document.body.removeChild(textarea);
                } catch (fallbackErr) {
                    console.error('Fallback copy failed', fallbackErr);
                }
            }

            if (copied) {
                setCopyButtonFeedback(true);
                showToast('Description sourcée copiée dans le presse-papier !', 'success');
            } else {
                showToast('Impossible de copier le texte.', 'error');
            }
        }

        function setCopyButtonFeedback(active) {
            const copyBtn = document.getElementById('copy-sourced-button');
            if (!copyBtn) return;
            const label = copyBtn.querySelector('.copy-label');
            if (active) {
                copyBtn.classList.add('copied');
                if (label) label.textContent = 'Copié !';
            } else {
                copyBtn.classList.remove('copied');
                if (label) label.textContent = 'Copier';
            }

            if (active) {
                setTimeout(() => {
                    setCopyButtonFeedback(false);
                }, 2000);
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const iconSvg = type === 'success'
                ? '<svg class="toast-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'
                : '<svg class="toast-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';

            toast.innerHTML = `${iconSvg}<span>${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        async function fetchFromPaths(paths) {
            let lastError;
            for (const path of paths) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) {
                        throw new Error(`Unable to load ${path} (HTTP ${response.status})`);
                    }
                    return await response.text();
                } catch (error) {
                    lastError = error;
                }
            }
            throw lastError;
        }

        function detailedDescriptionPaths(filename) {
            return [
                `../gallica_analysis/analysis_outputs/descriptions/detailed_descriptions/${currentYear}/${filename}`,
                `./gallica_analysis/analysis_outputs/descriptions/detailed_descriptions/${currentYear}/${filename}`,
                `/gallica_analysis/analysis_outputs/descriptions/detailed_descriptions/${currentYear}/${filename}`,
                `../gallica_analysis/detailed_descriptions_gemini/${currentYear}/${filename}`,
                `./gallica_analysis/detailed_descriptions_gemini/${currentYear}/${filename}`
            ];
        }

        function sourcedDescriptionPaths(filename) {
            return [
                `../gallica_analysis/analysis_outputs/descriptions/sourced_descriptions/${currentYear}/${filename}`,
                `./gallica_analysis/analysis_outputs/descriptions/sourced_descriptions/${currentYear}/${filename}`,
                `/gallica_analysis/analysis_outputs/descriptions/sourced_descriptions/${currentYear}/${filename}`,
                `../gallica_analysis/sourced_descriptions_gemini/${currentYear}/${filename}`,
                `./gallica_analysis/sourced_descriptions_gemini/${currentYear}/${filename}`
            ];
        }

        function cleanArticlePaths(filename, newspaper = currentNewspaper) {
            return [
                `../gallica_analysis/analysis_outputs/clean_articles/${newspaper}/${currentYear}/${filename}`,
                `./gallica_analysis/analysis_outputs/clean_articles/${newspaper}/${currentYear}/${filename}`,
                `/gallica_analysis/analysis_outputs/clean_articles/${newspaper}/${currentYear}/${filename}`
            ];
        }

        async function fetchCleanArticleWithFallback(newspaper, stageNumber) {
            try {
                const text = await fetchFromPaths(cleanArticlePaths(`stage_${stageNumber}.txt`, newspaper));
                return { text, resolvedStage: stageNumber, isNextStageFallback: false };
            } catch (primaryError) {
                const nextStage = stageNumber + 1;
                try {
                    const text = await fetchFromPaths(cleanArticlePaths(`stage_${nextStage}.txt`, newspaper));
                    return { text, resolvedStage: nextStage, isNextStageFallback: true };
                } catch {
                    throw primaryError;
                }
            }
        }

        function arkCachePaths(newspaper) {
            return [
                `../gallica_analysis/cache/ark_ids/${newspaper}_ark_ids.json`,
                `./gallica_analysis/cache/ark_ids/${newspaper}_ark_ids.json`,
                `/gallica_analysis/cache/ark_ids/${newspaper}_ark_ids.json`,
                `../gallica_analysis/cache/${newspaper}_ark_ids.json`,
                `./gallica_analysis/cache/${newspaper}_ark_ids.json`
            ];
        }

        function loadArkCache(newspaper) {
            if (!arkCachePromises[newspaper]) {
                arkCachePromises[newspaper] = fetchFromPaths(arkCachePaths(newspaper))
                    .then(JSON.parse)
                    .catch(error => {
                        delete arkCachePromises[newspaper];
                        throw error;
                    });
            }
            return arkCachePromises[newspaper];
        }

        function switchNewspaper(newspaperId) {
            currentNewspaper = newspaperId;
            const info = currentStageArticles[newspaperId];
            const newspaperLabel = newspaperNames[newspaperId] || newspaperId;

            const heading = document.getElementById('article-heading');
            const fallbackBadge = document.getElementById('article-fallback-badge');
            const gallicaLink = document.getElementById('gallica-article-link');

            if (heading) {
                const resolvedDate = info?.articleDate || '';
                const formattedDate = formatArticleDate(resolvedDate);
                const dateText = formattedDate ? ` du ${formattedDate}` : '';
                heading.textContent = `Article de ${newspaperLabel}${dateText}`;
            }

            if (fallbackBadge) {
                if (info?.isNextStageFallback) {
                    fallbackBadge.textContent = `Édition étape ${info.resolvedStage}`;
                    fallbackBadge.title = `Aucun numéro disponible pour cette étape ; affichage de l'édition de l'étape ${info.resolvedStage}`;
                    fallbackBadge.hidden = false;
                } else {
                    fallbackBadge.hidden = true;
                }
            }

            if (gallicaLink) {
                const arkId = info?.arkId;
                if (typeof arkId === 'string' && /^[a-zA-Z0-9]+$/.test(arkId)) {
                    gallicaLink.href = `https://gallica.bnf.fr/ark:/12148/${arkId}`;
                    gallicaLink.hidden = false;
                } else {
                    gallicaLink.hidden = true;
                }
            }

            NEWSPAPERS.forEach(n => {
                const panel = document.getElementById(`article-content-${n.id}`);
                const isActive = n.id === newspaperId;
                if (panel) {
                    panel.hidden = !isActive;
                    panel.style.display = isActive ? '' : 'none';
                }
            });

            document.querySelectorAll('.newspaper-tab-button').forEach(button => {
                const isActive = button.dataset.newspaper === newspaperId;
                button.classList.toggle('active', isActive);
                button.setAttribute('aria-selected', String(isActive));
            });
        }

        function formatArticleDate(dateStr) {
            if (!dateStr) return '';
            const dateParts = dateStr.match(/^(\d{2})-(\d{2})-(\d{4})/);
            if (!dateParts) return '';

            const [, day, month, year] = dateParts;
            const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
            return new Intl.DateTimeFormat('fr-FR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                timeZone: 'UTC'
            }).format(date);
        }

        async function fetchContent() {
            const requestId = ++contentRequest;
            const container = document.getElementById('content-area');
            const stageNumber = Number(currentFile.match(/^stage_(\d+)\.html$/)?.[1]);

            container.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <span>Chargement de l'étape ${stageNumber || ''}...</span>
                </div>`;

            if (!stageNumber) {
                container.innerHTML = `
                    <div class="load-error-box">
                        <p>Aucun article nettoyé n'est configuré pour l'année ${currentYear}, étape ${stageNumber || 'inconnue'}.</p>
                    </div>`;
                return;
            }

            const [descriptionResult, sourcedDescriptionResult, articleResults, arkCacheResults] = await Promise.all([
                fetchFromPaths(detailedDescriptionPaths(currentFile)).then(
                    value => ({ status: 'fulfilled', value }),
                    reason => ({ status: 'rejected', reason })
                ),
                fetchFromPaths(sourcedDescriptionPaths(currentFile)).then(
                    value => ({ status: 'fulfilled', value }),
                    reason => ({ status: 'rejected', reason })
                ),
                Promise.allSettled(NEWSPAPERS.map(n => fetchCleanArticleWithFallback(n.id, stageNumber))),
                Promise.allSettled(NEWSPAPERS.map(n => loadArkCache(n.id)))
            ]);

            if (requestId !== contentRequest) return;

            currentStageArticles = {};
            NEWSPAPERS.forEach((n, idx) => {
                const artRes = articleResults[idx];
                const arkRes = arkCacheResults[idx];
                if (artRes.status === 'fulfilled') {
                    const { text, resolvedStage, isNextStageFallback } = artRes.value;
                    const articleDate = articleDatesByYear[currentYear]?.[resolvedStage] || '';
                    const arkId = (arkRes.status === 'fulfilled' && articleDate)
                        ? arkRes.value[articleDate]
                        : null;
                    currentStageArticles[n.id] = {
                        available: true,
                        text,
                        resolvedStage,
                        isNextStageFallback,
                        articleDate,
                        arkId
                    };
                } else {
                    const articleDate = articleDatesByYear[currentYear]?.[stageNumber] || '';
                    currentStageArticles[n.id] = {
                        available: false,
                        text: '',
                        resolvedStage: stageNumber,
                        isNextStageFallback: false,
                        articleDate,
                        arkId: null,
                        reason: artRes.reason
                    };
                }
            });

            const newspaperTabsHtml = NEWSPAPERS.map(n => {
                const info = currentStageArticles[n.id];
                const isActive = n.id === currentNewspaper;
                const classes = [
                    'newspaper-tab-button',
                    isActive ? 'active' : '',
                    !info.available ? 'is-unavailable' : ''
                ].filter(Boolean).join(' ');
                const dot = info.isNextStageFallback
                    ? `<span class="newspaper-tab-dot" title="Édition de l'étape ${info.resolvedStage}"></span>`
                    : '';
                return `<button type="button" role="tab" class="${classes}"
                    data-newspaper="${n.id}"
                    aria-selected="${isActive}"
                    aria-controls="article-content-${n.id}"
                    onclick="switchNewspaper('${n.id}')">${n.label}${dot}</button>`;
            }).join('');

            const articlePanelsHtml = NEWSPAPERS.map(n => {
                const isActive = n.id === currentNewspaper;
                return `<div class="column-content article-content" id="article-content-${n.id}" role="tabpanel"${isActive ? '' : ' hidden style="display: none;"'}></div>`;
            }).join('');

            container.innerHTML = `
                <section class="content-column description-column">
                    <div class="column-header">
                        <h2 id="description-heading-group">
                            <svg class="header-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                            <span id="description-heading">Description détaillée</span>
                        </h2>
                        <div class="header-actions">
                            <div class="description-toggle" role="group" aria-label="Type de description">
                                <button type="button" class="description-toggle-button active"
                                    data-description-type="detailed" aria-pressed="true"
                                    aria-controls="detailed-description-content"
                                    onclick="switchDescription('detailed')">Détaillée</button>
                                <button type="button" class="description-toggle-button"
                                    data-description-type="sourced" aria-pressed="false"
                                    aria-controls="sourced-description-content"
                                    onclick="switchDescription('sourced')">Sourcée</button>
                            </div>
                        </div>
                    </div>
                    <div class="column-content" id="detailed-description-content"></div>
                    <div class="raw-description-wrapper" id="sourced-description-content" hidden style="display: none;">
                        <div class="raw-description-toolbar">
                            <div class="raw-meta-group">
                                <span class="raw-pill">MediaWiki / Ref</span>
                                <span id="sourced-stats" class="raw-stats"></span>
                            </div>
                            <button type="button" class="action-button copy-button" id="copy-sourced-button" onclick="copySourcedDescription()" title="Copier la description sourcée">
                                <svg class="copy-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <svg class="check-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                                <span class="copy-label">Copier</span>
                            </button>
                        </div>
                        <pre class="raw-description-text" id="sourced-description-text"></pre>
                    </div>
                </section>
                <section class="content-column article-column">
                    <div class="column-header">
                        <h2>
                            <svg class="header-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
                                <path d="M18 14h-8"></path>
                                <path d="M15 18h-5"></path>
                                <path d="M10 6h8v4h-8V6Z"></path>
                            </svg>
                            <span id="article-heading">Article</span>
                            <span id="article-fallback-badge" class="fallback-pill" hidden></span>
                        </h2>
                        <a class="gallica-link-btn" id="gallica-article-link" href="#" target="_blank" rel="noopener noreferrer" hidden title="Consulter l'édition sur Gallica (BnF)">
                            <span>Voir sur Gallica</span>
                            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                                <polyline points="15 3 21 3 21 9"></polyline>
                                <line x1="10" y1="14" x2="21" y2="3"></line>
                            </svg>
                        </a>
                    </div>
                    <div class="newspaper-tabs-bar">
                        <div class="newspaper-tabs" role="tablist" aria-label="Sélection du journal">
                            ${newspaperTabsHtml}
                        </div>
                    </div>
                    ${articlePanelsHtml}
                </section>`;

            switchDescription(currentDescriptionType);

            // Render all 5 clean articles into their respective panels
            const allSectionsByNumber = new Map();
            NEWSPAPERS.forEach(n => {
                const panel = document.getElementById(`article-content-${n.id}`);
                const info = currentStageArticles[n.id];
                if (info.available) {
                    const sections = renderArticleSections(panel, info.text, n.id);
                    for (const [sectionNumber, sectionEl] of sections.entries()) {
                        if (!allSectionsByNumber.has(sectionNumber)) {
                            allSectionsByNumber.set(sectionNumber, {
                                element: sectionEl,
                                newspaperId: n.id,
                                panel
                            });
                        }
                    }
                } else {
                    panel.innerHTML = `<div class="load-error-box"><p>Aucun article nettoyé de ${n.label} n’est disponible pour cette étape.</p></div>`;
                }
            });

            switchNewspaper(currentNewspaper);

            // Render Detailed Description
            if (descriptionResult.status === 'fulfilled') {
                const descriptionContent = document.getElementById('detailed-description-content');
                descriptionContent.innerHTML = descriptionResult.value;
                linkDescriptionCitations(descriptionContent, allSectionsByNumber);
            } else {
                document.getElementById('detailed-description-content').innerHTML =
                    '<div class="load-error-box"><p>La description détaillée n’a pas pu être chargée.</p></div>';
                console.error(descriptionResult.reason);
            }

            // Render Sourced Description
            if (sourcedDescriptionResult.status === 'fulfilled') {
                currentSourcedRawText = sourcedDescriptionResult.value;
                const textEl = document.getElementById('sourced-description-text');
                if (textEl) textEl.textContent = currentSourcedRawText;

                const statsEl = document.getElementById('sourced-stats');
                if (statsEl) {
                    const lines = currentSourcedRawText.split(/\r\n|\r|\n/).length;
                    statsEl.textContent = `${lines} lignes • ${currentSourcedRawText.length.toLocaleString('fr-FR')} caractères`;
                }

                const copyBtn = document.getElementById('copy-sourced-button');
                if (copyBtn) copyBtn.disabled = false;
            } else {
                currentSourcedRawText = '';
                document.getElementById('sourced-description-content').innerHTML =
                    '<div class="load-error-box" style="margin: 16px;"><p>La description sourcée n’est pas disponible pour cette étape.</p></div>';
                const copyBtn = document.getElementById('copy-sourced-button');
                if (copyBtn) copyBtn.disabled = true;
                console.error(sourcedDescriptionResult.reason);
            }
        }

        function renderArticleSections(articleContent, articleText, newspaperId) {
            const sectionPattern = /^[ \t\r]*Section[ \t]+(\d+(?:\.\d+)?)[ \t\r]*:[ \t\r]*$/gim;
            const matches = [...articleText.matchAll(sectionPattern)];
            const sectionsByNumber = new Map();

            if (matches.length === 0) {
                const articleTextBlock = document.createElement('pre');
                articleTextBlock.className = 'article-raw-text';
                articleTextBlock.textContent = articleText;
                articleContent.append(articleTextBlock);
                return sectionsByNumber;
            }

            matches.forEach((match, index) => {
                const sectionNumber = match[1];
                const contentStart = match.index + match[0].length;
                const contentEnd = matches[index + 1]?.index ?? articleText.length;
                const sectionText = articleText
                    .slice(contentStart, contentEnd)
                    .replace(/^\r?\n/, '')
                    .trimEnd();

                const section = document.createElement('section');
                const header = document.createElement('div');
                const badge = document.createElement('span');
                const textBlock = document.createElement('pre');

                section.id = `article-section-${sectionNumber.replace('.', '-')}`;
                section.className = 'article-section';
                section.dataset.sectionNumber = sectionNumber;
                section.dataset.newspaper = newspaperId;
                section.tabIndex = -1;

                header.className = 'article-section-header';
                badge.className = 'section-badge';
                badge.textContent = `Section ${sectionNumber}`;
                header.append(badge);

                textBlock.className = 'article-section-body';
                textBlock.textContent = sectionText;

                section.append(header, textBlock);
                articleContent.append(section);

                if (!sectionsByNumber.has(sectionNumber)) {
                    sectionsByNumber.set(sectionNumber, section);
                }
            });

            return sectionsByNumber;
        }

        function linkDescriptionCitations(descriptionContent, allSectionsByNumber) {
            const citationPattern = /\[(\s*\d+(?:\.\d+)?(?:\s*,\s*\d+(?:\.\d+)?)*\s*)\]/g;
            const textNodes = [];
            const walker = document.createTreeWalker(descriptionContent, NodeFilter.SHOW_TEXT);

            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }

            for (const textNode of textNodes) {
                if (!textNode.textContent) continue;
                citationPattern.lastIndex = 0;
                if (!citationPattern.test(textNode.textContent)) continue;
                citationPattern.lastIndex = 0;

                const fragment = document.createDocumentFragment();
                let cursor = 0;
                let citationMatch;

                while ((citationMatch = citationPattern.exec(textNode.textContent))) {
                    fragment.append(textNode.textContent.slice(cursor, citationMatch.index), '[');
                    const citationParts = citationMatch[1].match(/\d+(?:\.\d+)?|[,\s]+/g) ?? [];
                    for (const part of citationParts) {
                        const target = /^\d+(?:\.\d+)?$/.test(part) ? allSectionsByNumber.get(part) : null;
                        if (target) {
                            const link = document.createElement('a');
                            const label = newspaperNames[target.newspaperId] || target.newspaperId;
                            link.className = 'article-citation';
                            link.href = `#${target.element.id}`;
                            link.textContent = part;
                            link.title = `Accéder à la section ${part} (${label})`;
                            fragment.append(link);
                        } else {
                            fragment.append(part);
                        }
                    }
                    fragment.append(']');
                    cursor = citationPattern.lastIndex;
                }

                fragment.append(textNode.textContent.slice(cursor));
                textNode.replaceWith(fragment);
            }

            descriptionContent.addEventListener('click', event => {
                const link = event.target instanceof Element
                    ? event.target.closest('a.article-citation')
                    : null;
                if (!link) return;

                const target = allSectionsByNumber.get(link.textContent);
                if (!target) return;

                event.preventDefault();
                if (currentNewspaper !== target.newspaperId) {
                    switchNewspaper(target.newspaperId);
                }

                const { element: section, panel: articleContent } = target;
                articleContent.scrollTo({
                    top: articleContent.scrollTop
                        + section.getBoundingClientRect().top
                        - articleContent.getBoundingClientRect().top
                        - 12,
                    behavior: 'smooth'
                });

                document.querySelectorAll('.article-section.highlight-target').forEach(el => {
                    el.classList.remove('highlight-target');
                });
                section.classList.add('highlight-target');
                section.focus({ preventScroll: true });

                setTimeout(() => {
                    section.classList.remove('highlight-target');
                }, 2500);
            });
        }
    </script>
