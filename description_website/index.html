<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descriptions du Tour de France</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="tour-de-france-logo.png">
</head>
<body>
    <h1>Descriptions détaillées du Tour de France</h1>

    <!-- STEP 1: Top Menu (Years) -->
    <div class="year-menu">
        <button class="year-button active" onclick="switchYear(event, '1947')">1947</button>
    </div>

    <!-- STEP 2: Second Menu (File Tabs) -->
    <div class="tab-menu">
        <!-- Note: We just pass the exact file name here -->
        <button class="tab-button active" onclick="switchTab(event, 'stage_1.html')">Étape 1</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_2.html')">Étape 2</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_3.html')">Étape 3</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_4.html')">Étape 4</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_5.html')">Étape 5</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_6.html')">Étape 6</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_7.html')">Étape 7</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_8.html')">Étape 8</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_9.html')">Étape 9</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_10.html')">Étape 10</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_11.html')">Étape 11</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_12.html')">Étape 12</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_13.html')">Étape 13</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_14.html')">Étape 14</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_15.html')">Étape 15</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_16.html')">Étape 16</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_17.html')">Étape 17</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_18.html')">Étape 18</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_19.html')">Étape 19</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_20.html')">Étape 20</button>
        <button class="tab-button" onclick="switchTab(event, 'stage_21.html')">Étape 21</button>
    </div>

    <!-- STEP 3: Side-by-side stage content -->
    <main id="content-area" class="content-panel" aria-live="polite">
        <em>Loading...</em>
    </main>

    <script>
        let currentYear = '1947';
        let currentFile = 'stage_1.html';
        let contentRequest = 0;
        let arkCachePromise;

        const articleFilesByYear = {
            '1947': {
                1: '26-06-1947_stage_1.txt',
                2: '27-06-1947_stage_2.txt',
                3: '28-06-1947_stage_3.txt',
                4: '29-06-1947_stage_4.txt',
                5: '30-06-1947_stage_5.txt',
                6: '02-07-1947_stage_6.txt',
                7: '03-07-1947_stage_7.txt',
                8: '04-07-1947_stage_8.txt',
                9: '06-07-1947_stage_9.txt',
                10: '07-07-1947_stage_10.txt',
                11: '09-07-1947_stage_11.txt',
                12: '10-07-1947_stage_12.txt',
                13: '11-07-1947_stage_13.txt',
                14: '12-07-1947_stage_14.txt',
                15: '14-07-1947_stage_15.txt',
                16: '15-07-1947_stage_16.txt',
                17: '16-07-1947_stage_17.txt',
                18: '17-07-1947_stage_18.txt',
                19: '19-07-1947_stage_19.txt',
                20: '20-07-1947_stage_20.txt',
                21: '21-07-1947_stage_21.txt'
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchContent();
        });

        function switchYear(event, year) {
            currentYear = year;
            document.querySelectorAll('.year-button').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            fetchContent();
        }

        function switchTab(event, filename) {
            currentFile = filename;
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            fetchContent();
        }

        async function fetchFromPaths(paths) {
            let lastError;
            for (const path of paths) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) {
                        throw new Error(`Unable to load ${path} (HTTP ${response.status})`);
                    }
                    return await response.text();
                } catch (error) {
                    lastError = error;
                }
            }
            throw lastError;
        }

        function contentPaths(directory, filename) {
            return [
                `../gallica_analysis/${directory}/${currentYear}/${filename}`,
                `./gallica_analysis/${directory}/${currentYear}/${filename}`
            ];
        }

        function arkCachePaths() {
            return [
                '../gallica_analysis/cache/equipe_ark_ids.json',
                './gallica_analysis/cache/equipe_ark_ids.json'
            ];
        }

        function loadArkCache() {
            if (!arkCachePromise) {
                arkCachePromise = fetchFromPaths(arkCachePaths())
                    .then(JSON.parse)
                    .catch(error => {
                        arkCachePromise = undefined;
                        throw error;
                    });
            }
            return arkCachePromise;
        }

        function formatArticleDate(filename) {
            const dateParts = filename.match(/^(\d{2})-(\d{2})-(\d{4})_/);
            if (!dateParts) return '';

            const [, day, month, year] = dateParts;
            const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
            return new Intl.DateTimeFormat('fr-FR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                timeZone: 'UTC'
            }).format(date);
        }

        async function fetchContent() {
            const requestId = ++contentRequest;
            const container = document.getElementById('content-area');
            const stageNumber = Number(currentFile.match(/^stage_(\d+)\.html$/)?.[1]);
            const articleFilename = articleFilesByYear[currentYear]?.[stageNumber];
            const articleDate = articleFilename?.match(/^(\d{2}-\d{2}-\d{4})_/)?.[1];
            container.innerHTML = '<em>Loading stage content...</em>';

            if (!articleFilename) {
                container.innerHTML = `<p class="load-error">No cleaned Gemini article is configured for ${currentYear}, stage ${stageNumber || 'unknown'}.</p>`;
                return;
            }

            const [descriptionResult, articleResult, arkCacheResult] = await Promise.allSettled([
                fetchFromPaths(contentPaths('detailed_descriptions_gemini', currentFile)),
                fetchFromPaths(contentPaths('clean_articles_gemini', articleFilename)),
                loadArkCache()
            ]);

            if (requestId !== contentRequest) return;

            container.innerHTML = `
                <section class="content-column">
                    <div class="column-content" id="description-content"></div>
                </section>
                <section class="content-column">
                    <h2>
                        Article de L'Équipe du ${formatArticleDate(articleFilename)}
                        <a class="gallica-link" id="gallica-article-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Voir sur Gallica</a>
                    </h2>
                    <pre class="column-content article-content" id="article-content"></pre>
                </section>`;

            const gallicaLink = document.getElementById('gallica-article-link');
            if (arkCacheResult.status === 'fulfilled') {
                const arkId = articleDate ? arkCacheResult.value[articleDate] : null;
                if (typeof arkId === 'string' && /^[a-zA-Z0-9]+$/.test(arkId)) {
                    gallicaLink.href = `https://gallica.bnf.fr/ark:/12148/${arkId}`;
                    gallicaLink.hidden = false;
                } else {
                    console.error(`No Gallica ARK ID found for article dated ${articleDate || 'unknown'}.`);
                }
            } else {
                console.error(arkCacheResult.reason);
            }

            if (descriptionResult.status === 'fulfilled') {
                document.getElementById('description-content').innerHTML = descriptionResult.value;
            } else {
                document.getElementById('description-content').innerHTML =
                    '<p class="load-error">The detailed description could not be loaded.</p>';
                console.error(descriptionResult.reason);
            }

            if (articleResult.status === 'fulfilled') {
                document.getElementById('article-content').textContent = articleResult.value;
            } else {
                document.getElementById('article-content').textContent =
                    'The cleaned Gemini article could not be loaded.';
                document.getElementById('article-content').classList.add('load-error');
                console.error(articleResult.reason);
            }
        }
    </script>
</body>
</html>
