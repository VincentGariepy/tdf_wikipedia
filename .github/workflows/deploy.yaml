name: Deploy Custom Folder to Pages

on:
  push:
    branches: ["main"] # Change to "master" if your repository uses master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site/gallica_analysis
          cp -R description_website/. _site/
          cp -R gallica_analysis/detailed_descriptions_gemini _site/gallica_analysis/

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
